<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 喫茶店　NOGIZAKA </title>
</head>

<body>
  <header>
    <div>
    <figure style="width:80px;height:80px;" ><img style="max-width:100%;" src="logo2.png"></figure>
    </div>
    <div>
      <h1>喫茶店-NOGIZAKA KISSA</h1>
      <p>乃木坂にあるおしゃれな喫茶店</p>
    </div>
  </header>

  <div id="contents">
    <div id="nav">
      <!-- <a href="#about" id="lin01"><h2 style="color:#2b3064;">店舗紹介</h2></a>
      <a href="#menu" id="lin02"><h2 style="color:#2b3064;" >メニュー</h2></a>
      <a href="#access" id="lin03"><h2 style="color:#2b3064;">アクセス</h2></a> -->
      <button id="btn_about"> 店舗紹介 </button>
      <button id="btn_menu"> メニュー </button>
      <button id="btn_access"> アクセス </button>
    </div>
    <div id="scroll">
      <div class="article" id="about">
        <h2>店舗紹介</h2>
        <p>厳選したコーヒー豆を丁寧に自家焙煎、サイフォンでドリップ。落ち着きある静かな空間。</p>
        <div class="fig">
         <figure class="figureYY"><img style="max-width:100%;" src="kitichin.png"></figure>
         <figure class="figureYY"><img style="max-width:100%;" src="floor.png"></figure>
        </div>
      </div>
      <div class="article" id="menu">
        <h2>メニュー</h2>
        <div class="fig">
          <figure class="figureT"><img src="menu_hotcoffee.png"></figure>
          <figure class="figureT"><img src="menu_icecoffee.png"></figure>
          <figure class="figureT"><img src="menu_hottea.png"></figure>
          <figure class="figureT"><img src="menu_icetea.png"></figure>
          <figure class="figureT"><img src="menu_milktea.png"></figure>
          <figure class="figureT"><img src="menu_coffeejelly.png"></figure>
          <figure class="figureT"><img src="menu_pudding.png"></figure>
          <figure class="figureYY"><img src="menu_parfait.png"></figure>
          <figure class="figureYY"><img src="menu_cake.png"></figure>
        </div>
      </div>
      <div class="article" id="access">
        <h2>アクセス</h2>
        <p>〒000-0000 東京都港区乃木坂1-2-3</p>
        <p>TEL: 00-0000-0000</p>
        <div class="fig">
          <figure class="figureYY"><img src="mise.png"></figure>
          <figure class="figureYY"><img style="height:100%;" src="map.bmp"></figure>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <h2>© 2026 NOGIZAKA</h2>
  </footer>
</body>

<script>
 let A01 = document.getElementById("about");
 let A02 = document.getElementById("menu");
 let A03 = document.getElementById("access");
 
 let B01 = document.getElementById("btn_about");
 let B02 = document.getElementById("btn_menu");
 let B03 = document.getElementById("btn_access");
 
  B01.addEventListener("click",function() {
  A01.style.display="block";
  A02.style.display="none";
  A03.style.display="none";
  });
  B02.addEventListener("click",function() {
   A01.style.display="none";
   A02.style.display="block";
   A03.style.display="none";
  });
  B03.addEventListener("click",function() {
   A01.style.display="none";
   A02.style.display="none";
   A03.style.display="block";
  });
</script>


<style>
    :root{
      --beige:#c3b69782;
      --black:#0f1409;
      --yellow:#b6a63f;
      --red:#803a3a;
      --white:#b4b2ab98;
      --green:#435943;
      --green2:#abb5ab;
    }

    body {
      display:block;
    }
    body header {
      position:sticky; top:0;
      display:flex;            /*　header内の子要素を横並びにする　*/
    }
    body footer {
      position:sticky; bottom:0;
      display:flex;            /*　header内の子要素を横並びにする　*/
    }
    body #contents {
      display:flex;
      flex-direction:row;
    }
    body #contents #nav {
     position: sticky;
     top: 140px;
     display:block;
      /* flex-direction: column;  子要素を縦に並べる　 */
    }
    body #contents #scroll {
      display:block;
      overflow:auto;
    }
    body #contents #scroll .article .fig {
      border:solid 1px var(--red);
      display:flex;          /*　fig内の子要素を横並びにする　*/
      flex-direction:row;
      flex-wrap:wrap;
      overflow:hidden;
    }
    body {
      width:100%; max-width:1900px;
      color:var(--black);
      background-color:var(--beige);     
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
      line-height:1.7;
    }
    body header,footer {
      width:100%; max-width:1600px; margin:auto;
      min-height:100px;
      box-sizing: border-box;
      border:solid 1px var(--red);
      background-color:var(--green);
      color:var(--yellow);
    }
   
    body #contents {
      width:100%; max-width:1600px; margin:auto;
      min-height:1120px;
      border:solid 1px var(--red);
    }
    body #contents #nav {
      width:150px;
      height:1000px;
      background-color:var(--green2);
      border:solid 1px var(--red);
      z-index:1000;
      text-decoration:underline;
      font-size:0.9em;
      font-weight:bold;
    }
    body #contents #nav button {
      width:120px;
      height:100px;
      margin-top:100px;
      margin-left:auto;
      margin-right:auto;
      color:#0f1409;
      background-color:#eaece6;
      font-size:0.9em;
      font-weight:bold;
     }
    body #contents #nav button:hover {
      background-color:#c37488;
     }
    body #contents #scroll {
      color:#11391d;
      border:solid 1px var(--red);
    }
    body #contents #scroll .article {
      background:var(--white);
      padding:12px;
      border-radius:12px;
      border:solid 1px var(--red);
      text-align:center;
      font-size:0.9em;
    }
    /*大きい横長画像*/
    .figureYY{      display:block;      width:560px;      height:448px;    }
    /*小さい横長画像*/
    .figureY{      display:block;      width:467px;      height:374px;    }
     /*小さい縦長画像*/
    .figureT{      display:block;      width:374px;      height:467px;    }
        
    img{
      max-width:100%;   border-radius:10px;   margin-bottom:8px;
    }

    @media(max-width:800px){
      header{
      display:flex;
      width:100%;
      }      
      header div figure {
      width:100%;
      height:100px;
      margin-left: 10px;
      }
      body #contents {
      display: block;
      width:100%;
      }
      body #contents #nav {
      display:flex;
      flex-direction: row; /* 子要素を横に並べる　*/
      width:100%;
      height:200px;
      }
      body #contents #nav button {
      width:80px;
      height:80px;
      }
      body #contents #scroll {
      display: block;
      width:100%;
      height:2000px;
      }
      .article{
      margin-left:auto;
      margin-right:auto;
      }
      body footer{
      margin-left:auto;
      margin-right:auto;
      width:100%;
      }
    }
  </style>


</html>
